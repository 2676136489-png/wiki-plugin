  <header class="page-hero">
    <span class="eyebrow">插件 06 · 媒体</span>
    <h1>前后对比滑杆</h1>
    <p class="hero-copy">适合展示原型迭代、显微图像分割、模型精修或界面版本变化。用一个滑杆把“修改前”和“修改后”放在同一块画布上。</p>
  </header>

  <main class="section">
    <div class="compare" data-compare>
      <div class="compare-layer is-before"><div><span class="badge">修改前</span><h2>初始原型</h2><p>对比度偏低、标签不清楚，证据层级不明显。</p></div></div>
      <div class="compare-layer compare-after"><div><span class="badge">修改后</span><h2>精修原型</h2><p>主张更清楚、控件分组更合理，阅读路径更顺。</p></div></div>
      <input type="range" min="10" max="90" value="50" aria-label="对比位置">
    </div>
  </main>

  <footer class="site-footer">
    <div><strong>前后对比滑杆</strong><p>使用原生 range 输入，触屏设备也能直接拖动。</p></div>
