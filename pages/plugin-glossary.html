    <h1>术语悬浮注释</h1>
    <p class="hero-copy">给技术术语加一层即时解释。读者不用离开上下文，评审也能更快理解你的设计选择。</p>

      <section id="demo" class="content-section">
        <h2>可读的技术文本</h2>
        <p>我们在比较生长条件、生物安全要求与报告基因表现之后，选择了当前的<span class="note" tabindex="0" data-note="底盘（chassis）指承载工程化基因部件的宿主生物或细胞体系。">底盘</span>。最终设计使用一种<span class="note" tabindex="0" data-note="报告基因把生物活动转换成可测信号，例如荧光、颜色或发光。">报告基因</span>，便于快速筛选。</p>
        <p>所有术语都在第一次出现时解释一次，后文不再重复打断。</p>
      </section>
